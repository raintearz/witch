<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫长岁月的余烬</title>
    <style>
        :root {
            --bg-deep: #0a0810;
            --bg-panel: #14101c;
            --border-color: #3b2b52;
            --text-main: #e2ddeb;
            --text-dim: #9b8aab;
            --accent-gold: #d4b86a;
            --accent-purple: #7a58a3;
            --danger-red: #c95a6b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }

        #game-wrapper { 
            position: relative; width: 100%; max-width: 1200px; height: 100vh; 
            display: flex; flex-direction: column;
        }

        @media (min-width: 768px) {
            #game-wrapper { height: 90vh; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 起始界面 */
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #1b1329 0%, var(--bg-deep) 100%); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 50; padding: 20px;
        }
        #start-screen h1 { color: var(--accent-gold); font-size: 2rem; margin-bottom: 20px; text-shadow: 0 2px 10px rgba(212,184,106,0.3); }
        .intro-text { color: var(--text-dim); max-width: 680px; line-height: 1.8; margin-bottom: 30px; font-size: 15px; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 6px; border-left: 4px solid var(--accent-purple); }
        .input-group { margin-bottom: 20px; width: 100%; max-width: 300px; }
        .input-group label { color: var(--accent-gold); font-size: 14px; display: block; margin-bottom: 8px; }
        .input-group input { 
            width: 100%; background: rgba(20,16,28,0.8); border: none; border-bottom: 2px solid var(--accent-purple); 
            color: #fff; padding: 12px; outline: none; text-align: center; font-size: 16px; transition: 0.3s; 
        }
        .input-group input:focus { border-bottom-color: var(--accent-gold); }
        
        .btn-main { 
            background: linear-gradient(135deg, #3b2b52, #231836); border: 1px solid var(--accent-gold); 
            color: var(--accent-gold); padding: 12px 30px; cursor: pointer; font-size: 16px; 
            border-radius: 4px; transition: 0.3s; margin-top: 10px; width: 100%; max-width: 300px;
        }
        .btn-main:hover { background: linear-gradient(135deg, #4d386b, #33234d); color: #fff; }

        /* 游戏主容器 */
        #game-container { display: flex; flex-direction: column; height: 100%; }

        /* 顶部栏 */
        #top-bar { 
            height: 50px; border-bottom: 1px solid var(--border-color); display: flex; 
            justify-content: space-between; align-items: center; padding: 0 20px; 
            background: rgba(10,8,16,0.9); flex-shrink: 0; font-size: 14px;
        }
        .time-info { color: var(--text-dim); }
        .time-info span { color: var(--accent-gold); font-weight: bold; }

        /* 响应式主体布局 */
        #main-area { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        @media (min-width: 768px) { #main-area { flex-direction: row; } }

        /* 左侧/顶部 面板 */
        #left-panel { 
            border-right: 1px solid var(--border-color); padding: 15px; 
            background: var(--bg-panel); display: flex; flex-direction: row; overflow-x: auto; flex-shrink: 0; border-bottom: 1px solid var(--border-color);
        }
        @media (min-width: 768px) { 
            #left-panel { width: 300px; flex-direction: column; overflow-y: auto; overflow-x: hidden; border-bottom: none; } 
        }
        
        .stat-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; border: 1px solid #2a1f3d; min-width: 200px; margin-right: 10px; }
        @media (min-width: 768px) { .stat-box { margin-right: 0; margin-bottom: 20px; } }
        
        .stat-box h3 { font-size: 14px; color: var(--accent-purple); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 10px; font-weight: normal; }
        .stat-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: var(--text-main); align-items: center;}
        .stat-val { font-weight: bold; }
        .stat-danger { color: var(--danger-red); }
        
        .progress-bar { width: 80px; height: 6px; background: #000; border-radius: 3px; overflow: hidden; border: 1px solid var(--border-color); }
        .progress-fill { height: 100%; background: var(--accent-purple); transition: width 0.3s; }
        .progress-fill.fatigue { background: #566c82; }

        #inventory-box { flex: 1; display: none; flex-direction: column; gap: 10px; }
        @media (min-width: 768px) { #inventory-box { display: flex; } }
        .item { font-size: 12px; color: var(--text-dim); background: rgba(0,0,0,0.3); padding: 8px; border-left: 2px solid var(--accent-purple); border-radius: 0 4px 4px 0; }
        .item-name { color: var(--accent-gold); display: block; margin-bottom: 3px; }

        /* 右侧面板 */
        #right-panel { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        #location-bar { 
            display: flex; padding: 10px; gap: 10px; background: var(--bg-deep); 
            border-bottom: 1px solid var(--border-color); overflow-x: auto; flex-shrink: 0;
            scrollbar-width: none;
        }
        #location-bar::-webkit-scrollbar { display: none; }
        .loc-btn { 
            background: transparent; color: var(--text-dim); border: none; font-size: 14px; 
            cursor: pointer; padding: 5px 10px; border-bottom: 2px solid transparent; white-space: nowrap;
        }
        .loc-btn:hover { color: var(--text-main); }
        .loc-btn.active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }

        /* 文本区域 */
        #story-box { 
            flex: 1; padding: 20px; overflow-y: auto; line-height: 1.8; font-size: 15px; 
            background: radial-gradient(circle at top, rgba(20,16,28,0.4) 0%, transparent 100%);
        }
        @media (min-width: 768px) { #story-box { padding: 30px 40px; font-size: 16px; } }
        
        .entry { margin-bottom: 20px; opacity: 0.95; }
        .entry.sys { color: var(--text-dim); font-size: 14px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; border-left: 2px solid gray; }
        .entry.event { color: #fff; padding: 20px; background: rgba(30,22,45,0.6); border: 1px solid var(--border-color); border-left: 4px solid var(--accent-gold); border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .entry.danger { color: #f5d7db; padding: 20px; background: rgba(50,20,30,0.4); border: 1px solid #752a36; border-left: 4px solid var(--danger-red); }
        
        /* 动作按钮区 */
        #action-bar { 
            padding: 15px; background: var(--bg-panel); border-top: 1px solid var(--border-color); 
            display: flex; flex-wrap: wrap; gap: 10px; flex-shrink: 0; justify-content: center;
        }
        .act-btn { 
            background: rgba(10,8,16,0.8); color: var(--text-main); border: 1px solid var(--border-color); 
            padding: 10px; cursor: pointer; transition: 0.2s; font-size: 14px; text-align: center; 
            border-radius: 4px; flex-grow: 1; flex-basis: calc(50% - 10px); max-width: 250px;
        }
        @media (min-width: 768px) { .act-btn { flex-basis: calc(33.33% - 10px); } }
        .act-btn:hover { border-color: var(--accent-gold); background: rgba(30,22,45,0.8); }
        .act-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
        
        .btn-event { width: 100%; background: #231836; border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 12px; cursor: pointer; font-size: 15px; margin-bottom: 10px; border-radius: 4px; transition: 0.3s; }
        .btn-event:hover { background: #3b2b52; color: #fff; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="start-screen">
        <h1>漫长岁月的余烬</h1>
        <div class="intro-text">
            人类对于“不老魔女”的认知，往往停留在话本里那些被过度浪漫化或是妖魔化的片段。他们以为魔女的岁月只是由无数场华丽的魔法战、几段跨越种族的凄美爱情以及在黑森林里熬制魔药组成的。<br><br>
            只有你自己知道，永生，是一场极其宏大、宏大到近乎残忍的单向旅行。你经历过太多次离别、背叛、狂热的爱恋和彻骨的仇恨。所有的情绪，在拉长到千年的尺度后，都会被稀释成一杯白水。<br><br>
            在一个下着雨的傍晚，你拎着刚买的限量草莓蛋糕，在暗巷里捡到了一个脏兮兮的男孩。
        </div>
        <div class="input-group"><label>你的名字</label><input type="text" id="witchName" value="艾莉希娅"></div>
        <div class="input-group"><label>男孩的名字</label><input type="text" id="boyName" value="卢西恩"></div>
        <button class="btn-main" onclick="startGame()">带他回家</button>
    </div>

    <div id="game-container" class="hidden">
        <div id="top-bar">
            <div class="time-info">第 <span id="ui-year">1</span> 年 <span id="ui-month">1</span> 月</div>
            <div class="time-info"><span id="ui-w-name">艾莉</span> | 养子：<span id="ui-b-name">卢西恩</span> (<span id="ui-age">7</span> 岁)</div>
        </div>
        <div id="main-area">
            <div id="left-panel">
                <div class="stat-box">
                    <h3>魔女状态</h3>
                    <div class="stat-line"><span>心情</span> <div class="progress-bar"><div class="progress-fill" id="w-mood" style="width: 80%;"></div></div></div>
                    <div class="stat-line"><span>疲劳</span> <div class="progress-bar"><div class="progress-fill fatigue" id="w-fatigue" style="width: 10%;"></div></div></div>
                </div>
                <div class="stat-box">
                    <h3>养子观测</h3>
                    <div class="stat-line"><span>魔法</span> <span class="stat-val" id="b-magic">0</span></div>
                    <div class="stat-line"><span>学识</span> <span class="stat-val" id="b-know">0</span></div>
                    <div class="stat-line"><span>乖巧</span> <span class="stat-val" id="b-obed">10</span></div>
                    <div class="stat-line"><span>偏执</span> <span class="stat-val stat-danger" id="b-obsess">0</span></div>
                </div>
                <div id="inventory-box"></div>
            </div>
            <div id="right-panel">
                <div id="location-bar">
                    <button class="loc-btn active" onclick="changeLoc('hall')">高塔大厅</button>
                    <button class="loc-btn" onclick="changeLoc('workshop')">魔女工坊</button>
                    <button class="loc-btn" onclick="changeLoc('library')">地下书库</button>
                    <button class="loc-btn" onclick="changeLoc('garden')">温室庭院</button>
                    <button class="loc-btn hidden" id="btn-town" onclick="changeLoc('town')">王城街道</button>
                    <button class="loc-btn hidden" id="btn-academy" onclick="changeLoc('academy')">王城学院</button>
                </div>
                <div id="story-box"></div>
                <div id="action-bar"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let g = {
        wName: "", bName: "", loc: 'hall',
        yr: 1, mo: 1, age: 7,
        b: { magic: 0, know: 0, obed: 10, obsess: 0 },
        w: { mood: 80, fatigue: 10 },
        flags: { faintWarned: false, obsessWarned: false, after16: false, endTriggered: false },
        eventMode: false, currentEvent: null, eventStep: 0,
        inv: []
    };

    const locData = {
        'hall': [ 
            {t:"喝下午茶", a:'tea', h:"乖巧↑ 偏执↑ 疲劳↑"}, 
            {t:"随手逗弄", a:'tease', h:"偏执↑↑ 乖巧↓ 疲劳↑"}, 
            {t:"安抚情绪", a:'comfort', h:"偏执↓↓ 乖巧↑ 心情↓"},
            {t:"教授礼仪", a:'manner', h:"学识↑↑ 乖巧↑"} 
        ],
        'workshop': [ 
            {t:"熬制魔药", a:'brew', h:"心情↑ 疲劳↑↑"}, 
            {t:"深度休眠", a:'sleep', h:"疲劳↓↓↓↓ 心情↑↑"}, 
            {t:"水晶球观测", a:'scry', h:"学识↑ 疲劳↑"} 
        ],
        'library': [ 
            {t:"传授魔法", a:'teach', h:"魔法↑↑ 偏执↑ 疲劳↑↑"}, 
            {t:"让他自行翻阅", a:'read', h:"学识↑↑ 偏执↑"}, 
            {t:"指使他大扫除", a:'clean', h:"乖巧↑↑ 心情↑"} 
        ],
        'garden': [ 
            {t:"实战毒打", a:'combat', h:"魔法↑↑ 乖巧↓ 偏执↑↑ 疲劳↑"}, 
            {t:"藤椅小憩", a:'nap', h:"疲劳↓↓ 偏执↑"}, 
            {t:"培育草药", a:'plant', h:"魔法↑ 心情↑"} 
        ],
        'town': [ 
            {t:"逛街吃甜点", a:'sweets', h:"心情↑ 偏执↑↑"}, 
            {t:"隐身暗中观察", a:'spy', h:"学识↑ 乖巧↓"} 
        ],
        'academy': [
            {t:"去学校探视", a:'visit', h:"偏执↑↑↑ 乖巧↑"},
            {t:"悄悄旁听他的课", a:'listen', h:"学识↑ 魔法↑"}
        ]
    };

    function startGame() {
        g.wName = document.getElementById('witchName').value || "艾莉希娅";
        g.bName = document.getElementById('boyName').value || "卢西恩";
        document.getElementById('ui-w-name').innerText = g.wName;
        document.getElementById('ui-b-name').innerText = g.bName;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-container').classList.remove('hidden');
        
        changeLoc('hall');
        log(`你将那个名叫 ${g.bName} 的人类幼崽拎回了魔女塔。你漫长无聊的生命里多了一个会做饭打扫的小跟班，希望他能活得久一点。<br>（提示：随时注意你的疲劳值，如果疲劳值过高会导致魔力衰竭；另外，若放任他的偏执值飙升，后果自负。）`, 'sys');
        updateUI();
    }

    function changeLoc(loc) {
        if (g.eventMode) return;
        g.loc = loc;
        document.querySelectorAll('.loc-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderActions();
    }

    function renderActions() {
        let bar = document.getElementById('action-bar');
        bar.innerHTML = '';
        if (g.eventMode) return;
        
        locData[g.loc].forEach(btn => {
            let el = document.createElement('button');
            el.className = 'act-btn'; 
            el.innerHTML = `${btn.t}<div class="act-hint">${btn.h}</div>`;
            el.onclick = () => doAct(btn.a);
            bar.appendChild(el);
        });
    }

    function getCall() {
        if (g.b.obsess > 60 && g.b.obed < 40) return g.wName; 
        if (g.b.obsess > 40) return "您"; 
        return "母亲"; 
    }

    // 海量随机日常文本库
    function getDynamicText(type) {
        let ob = g.b.obsess, od = g.b.obed;
        const R = (arr) => arr[Math.floor(Math.random() * arr.length)];
        let call = getCall();
        let W = g.wName, B = g.bName;
        let isLate = g.flags.after16;

        if (type === 'comfort') {
            if (isLate) return R([
                `你伸手想揉他的头。他却一把抓住了你的手腕，力道大得惊人。他深深吸了一口你掌心的气息，低声说：“${call}，别再用对待小狗的方式敷衍我了。”`,
                `你耐下性子开导他。他安静地听着，眼神却放肆地描摹着你的唇线。安抚似乎只是让他把獠牙藏得更深了些。`,
                `你捧着他的脸说了一堆人生大道理。他根本没听进去，只是专注地看着你一张一合的嘴唇，喉结滚动了一下。`
            ]);
            return R([
                `你难得大发慈悲，揉了揉他乱糟糟的头发。他愣了一下，像只被顺毛的小野猫，收起了全身的尖刺，轻轻蹭了蹭你的掌心。`,
                `你注意到他盯着你的眼神过于幽暗，于是轻叹一声，将他拉到膝边，为他梳理因训练而凌乱的头发。“不要总是把自己逼得太紧。”你柔声说道。他深吸了一口气，眼中的疯狂暂且退潮，只留下深沉的依恋。`,
                `你塞给他一块草莓糖，告诉他别总皱着眉头。他小心翼翼地剥开糖纸，连同你的好意一起咽下，心情肉眼可见地变好了。`,
                `你随口夸了一句他今天做的饭很好吃。他那张常年冷着的脸难得泛起了一丝微红，转身又去厨房给你多烤了一盘小饼干。`
            ]);
        }

        if (type === 'tea') {
            if (isLate) return R([
                `他端来你最爱的红茶。当你们的手指相交时，他没有立刻退开，而是用指腹若有若无地摩挲了一下你的指节。这种隐秘的越界让他眼神微暗。`,
                `你吃着他做的点心，随口夸了一句。他低声说：“只要${call}喜欢，我的一切都可以端上您的餐桌。”你差点被饼干噎住。`,
                `他安静地为你添茶。你注意到他看你的眼神越来越不加掩饰，仿佛你才是盘子里那块涂满了奶油的草莓蛋糕。`,
                `你喝茶时，他用一种近乎虔诚的目光盯着那只被你触碰过的骨瓷茶杯。你毫不怀疑，当你离开后，他会去亲吻杯口残留的口红印记。`
            ]);
            return R([
                `他极其熟练地为你泡了一壶大吉岭红茶。你看着他忙前忙后、把家里打理得井井有条的样子，深感自己捡了个极其好用的全能保姆。`,
                `你一边喝茶一边吐槽几百年前那些来讨伐你的笨蛋骑士。他安静地听着，把你挑出来的点心碎屑默默吃掉，像只乖巧的忠犬。`,
                "你随口讲起几百年前的趣事，他听得很认真，似乎想把你经历的每一秒都刻在脑子里。",
                `你嫌弃茶太烫了。他立刻施展了初级冰霜魔法降温，看着他为了讨好你而展现出的惊人控制力，你敷衍地夸了一句，他耳朵都红了。`
            ]);
        }
        
        if (type === 'tease') {
            if (isLate) return R([
                `你戳了戳他的额头说他还是个小鬼。他突然上前一步，宽阔的肩膀几乎遮住了所有光线，将你困在椅背间。“${call}，”他压低声音，“需要我向您证明，我已经不是小鬼了吗？”`,
                `你用魔法变出猫耳戴在他头上取笑他。他没有摘下，反而用一种极具侵略性的目光盯着你，让你突然觉得这个恶作剧可能开过头了。`,
                `你捏住他的下巴端详。他顺势贪婪地呼吸着你指尖的香气，仿佛那是某种致命的成瘾物。`,
                `你用魔力捏出了水滴砸他的额头。他被砸得闭上眼，却完全没有闪躲，反而因为你能把注意力分给他而感到愉悦。`
            ]);
            return R([
                `你捏着他的脸向两边扯，硬是给他扯出一个滑稽的笑脸。他无奈地叹了口气，任由你折腾，只是耳朵根红透了。`,
                `你故意抢走他正在看的书。他无奈地叫了一声“${call}”，然后起身去厨房给你端来一盘刚烤好的曲奇作为交换。`,
                `你戳了戳他的肩膀说他太瘦弱了。他没有反驳，只是默默地回去加练了两个小时的体能。`,
                `你伸手挑起他的下巴，用嘲弄的语气评价他脆弱的人类躯体。他不仅没有被激怒，反而顺势前倾，温热的吐息几乎喷洒在你的指尖。“我会变强的，”他嗓音沙哑，“强到足以将您……”他咽下了后半句话。`
            ]);
        }

        if (type === 'manner') {
            return R([
                `你随手丢给他一本《贵族修养》。一个月后，他的一言一行完美得挑不出毛病，走出去简直像个虚伪但迷人的帝国小公爵。`,
                `教导礼仪时你打了他的手心。他不仅没有闪躲，反而用一种近乎虔诚的目光看着那把戒尺。你觉得这孩子是不是被你打傻了。`,
                `你让他练习华尔兹的舞步。当他的手搭在你的腰上时，你感觉到他在发抖。“他怎么这么紧张？”你想着。`
            ]);
        }

        if (type === 'sleep') {
            return R([
                `对于魔女来说，睡个小觉是非常必要的。当你从睡眠中醒来，浑身轻松。${B} 守在床边，眼底有淡淡的乌青，显然是一直守着你。`,
                `你舒舒服服地睡了个大觉。梦里似乎有什么温热的东西一直在触碰你的指尖，醒来时却只看到他正在专注地打扫房间。`,
                `睡眠是抚平岁月侵蚀的最好良药。你沉睡了很久，隐约感觉到有人在你的手背部落下无数个如羽毛般轻盈的吻。你懒得睁眼，只是享受着精神力的充盈。`,
                `摆烂，睡觉！你把外面的破事全都抛在脑后，结结实实地补了一觉。`,
                `你将意识沉入魔女的深眠。梦境中隐约有冰冷的蛇鳞滑过脚踝，醒来却只看到他坐在床头，手里端着温水，笑容无懈可击。`,
                `摆烂，睡觉！魔女的寿命就是用来浪费的！你恢复了大量精力和心情。`
            ]);
        }

        if (type === 'teach') {
            if (isLate && ob > 50) return R([
                `你讲解高阶法阵时，他靠得极近，呼吸都纠缠在一起。他学的不是如何释放魔法，而是如何将法阵反向刻印在灵魂上。`,
                `他学得太快了，甚至开始越界询问关于“灵魂同化”的高阶理论。你冷冷地瞥了他一眼，他立刻收起锋芒，低头称是。`,
                `他学会了极度危险的魔法。但在施展的瞬间，他看着靶子喃喃自语：“如果拥有这样的力量，是不是就能斩断所有看向您的多余视线了……”你皱起眉头敲了他的头。`
            ]);
            return R([
                `你教他火球术，结果他差点把温室给炸了。你气得敲他的头，他捂着脑袋认错，但手里的火元素纯粹得让你都有些惊讶。这小鬼天赋真可怕。`,
                `他在魔法上的理解力惊人，很多晦涩的古代魔文他看一遍就能记住。你深感欣慰，看来以后不用花钱请人修复魔法阵了。`,
                `教导高阶咒语时，他靠得极近，说话时的呼吸几乎喷洒在你的耳廓。你推开他，他低声道歉，眼中却满是遗憾。`,
                `你教导他精神控制魔法。但他学得太快了，甚至试图反向感知你的情绪。你冷笑一声，直接用精神力碾碎了他的试探。`
            ]);
        }

        if (type === 'read') {
            return R([
                `你在书架后偷看他。他迅速合上一本《跨越物种寿命论》，对你露出毫无破绽的微笑。这小动作全被你看在眼里。`,
                `他静静地看书，阳光洒在他逐渐长开的侧脸上。你恍惚间觉得他长大了，但他转头看向你时，眼神依旧像一潭深不见底的黑水。`,
                `你发现他最近借阅的全是关于远古法阵的书籍。你以为他只是对历史感兴趣，懒得多问。`,
                `他看书看累了，靠在书架上睡着。你恶作剧般在他脸上画了个乌龟。他醒来后发现不但没洗掉，还顶着乌龟脸给你做了一周的饭。`
            ]);
        }

        if (type === 'clean') {
            if (Math.random() < 0.2) return `他在角落里扫出了一块生锈的护心镜。你一看乐了：“哎哟，这不是三百年前那个喊着要讨伐我，结果自己平地摔断腿的勇者留下的嘛！”你笑得前仰后合。<br>他看着你灿烂的笑容，眼神微沉，转头就把那块护心镜丢进了熔炉，烧得渣都不剩。`;
            return R([
                `他任劳任怨地打扫着巨大的地下书库，把那些带有其他生物气息的旧物全部分门别类。你很满意他的工作效率。`,
                `这孩子在家务上有着惊人的执念。高塔里连一根蜘蛛丝都找不到，干净得连路过的史莱姆都要打滑。`,
                `大扫除时，他故意穿了件稍显单薄的白衬衫，汗水浸透了布料，隐约露出锻炼得极好的肌肉线条。你只是冷酷地指了指天花板上的蜘蛛网让他接着擦。`
            ]);
        }

        if (type === 'combat') {
            if (isLate) return R([
                `泥水飞溅。你的雷击擦过他的脸颊留下一道血痕。他舔去嘴角的血迹，像一头饿极了的狼崽借力扑向你，那种不顾一切的狠劲让你都感到一丝危险。`,
                `你毫不留情地用魔法藤蔓将他抽出十米远。他重重摔进泥潭，却迅速爬起，恭敬地低头：“感谢您的教诲，母亲。”`,
                `你用魔法藤蔓将他吊在半空作为惩罚。他垂着头，凌乱的头发下，嘴角却勾起一抹愉悦的弧度。`,
                `你故意露出了一个致命破绽。他手中的短刃停在距离你咽喉一寸的地方，手背青筋暴起。他丢下刀，跪在你面前喘息，仿佛只要再进一步，他那被压抑的疯狂就会彻底决堤。`
            ]);
            return R([
                `你毫不留情地用魔法藤蔓把他抽飞。他从地上爬起来，虽然灰头土脸，但眼神坚毅，完全没有退缩的意思。`,
                "他展现出了极其恐怖的魔法天赋，对魔力的微操甚至超过了同龄的精灵。",
                "实战中你稍微加重了力道。他被击飞，却在落地的瞬间借力冲向你，虽然最后还是失败了，但那如同野兽扑食的本能让你微微挑眉。",
                `实战毒打是最好的教学。你把他按在泥地里摩擦了一顿，他非但没有怨言，反而极其认真地复盘了刚才的失误。真是个好苗子。`,
                `他进步神速，甚至能预判你的小动作。你不得不稍微认真了一点，直接用魔力威压把他按在地上。他心服口服。`
            ]);
        }

        if (type === 'visit') {
            if (Math.random() < 0.3) return `你突发奇想，打扮得极其漂亮去学院看他。当着全校师生的面，你极其自然地凑过去亲了一口他的脸颊。<br>他的身体瞬间僵硬成了一块石头，连呼吸都停滞了。而整个学院的男生都向他投去了嫉妒得发狂的目光。他低垂的眼底翻涌着剧烈的风暴。`;
            return R([
                `你高调出现在学院。他迅速走到你身边，挡住了所有试图向你献殷勤的男导师，周围散发着极其明显的低气压。`,
                `你在学院食堂和他共进午餐。他无视了周围所有的目光，只专注地为你挑去鱼肉里的刺，动作优雅而熟练。`,
                `你给他带了午餐。他当着所有同学的面，极其优雅又带着炫耀意味地吃完了每一口，并宣誓主权般吻了你的手背。你认为他长大了懂礼貌了。`,
                `你给他带了自己随手熬的魔药补充体力。他当着所有同学的面，极其优雅又带着炫耀意味地喝完了每一滴。`
            ]);
        }

        if (type === 'listen') {
            return R([
                `你隐身坐在教室后排听他上课。听着那些简单的初级理论，你差点睡着，但他却听得很认真，还做了厚厚的笔记。`,
                `你看到他在课上完美地回答了导师极其刁钻的问题，引来周围同学的惊叹。你得意地想，不愧是我带出来的。`
            ]);
        }

        if (type === 'sweets') {
            return R([
                `你带他去买最新款的草莓蛋糕。街上的少女频频看他，他却完全无视，只专注地用手帕擦去你嘴角的奶油。`,
                `人类的城镇热闹非凡。有个醉汉想撞你，还没碰到你的衣角，就被他不动声色地用暗影魔法绊了个狗吃屎。`,
                `你给他买了一根糖葫芦。他明明不喜欢甜食，却差点连同木签都咬碎咽了下去，只因为那是你给的。`
            ]);
        }

        const commonTexts = [
            `光阴在塔内静静流淌。你吃着甜点，看着他在阳光下整理书架，觉得漫长的寿命似乎也不算太无聊。`,
            `你让他培育毒草。他指尖被刺破，鲜血滴在紫色的花瓣上。他毫不在意地舔去血液，继续为你劳作。`,
            `他为你种出了极其罕见的魔草。你高兴地夸了他两句，他表面平静，嘴角却怎么也压不下来。`,
            `你在水晶球里看人类帝国的八卦。他一边帮你剥葡萄皮，一边陪你听着那些无聊的宫廷秘辛。`,
            `你让他去拿曼陀罗根，他却因为偷看你写在桌角的私人笔记而打翻了坩埚。你毫不留情地罚他抄写魔药图鉴。`
            `你通过水晶球观测大陆局势。他凑过来看，当你占卜到某位人类王子时，水晶球突然莫名其妙地裂开了一道缝。你怀疑是假冒伪劣产品。`,
            `你在水晶球里看人类帝国的狗血肥皂剧。他陪你看，但他完全看不懂剧情，只是在看你被逗笑的样子。`,
            `你试图占卜，但是失败了。你烦躁地把水晶球当保龄球滚了出去，${g.bName} 像一只训练有素的猎犬一样跑过去把它捡了回来。`
        ];
        return R(commonTexts);
    }

    function doAct(type) {
        if (g.w.fatigue >= 95 && !g.flags.faintWarned && type !== 'sleep') {
            log(`【魔女的疲态】你活得太久，久到忘记了这具躯体也会疲惫。你的视线开始模糊，魔力运转出现凝滞。如果再不【休眠】休息，你将会陷入长达一个月的魔力衰竭。`, 'danger');
            g.flags.faintWarned = true;
            return;
        }

        let txt = getDynamicText(type);
        
        let cM = 0, cK = 0, cO = 0, cOb = 0, cF = Math.floor(Math.random()*4)+3, cMood = -2;
        
        if (type==='tea') { cOb=1; cO=2; }
        if (type==='tease') { cO=3; cOb=-2; }
        if (type==='comfort') { cO=-5; cOb=2; cMood=-4; } 
        if (type==='manner') { cK=3; cOb=1; }
        if (type==='brew') { cMood=5; cF+=5; }
        if (type==='sleep') { cF=-40; cMood=15; g.flags.faintWarned = false; }
        if (type==='scry') { cK=2; }
        if (type==='teach') { cM=4; cO=1; cF+=5; }
        if (type==='read') { cK=3; cO=1; }
        if (type==='clean') { cOb=2; cMood=5; }
        if (type==='combat') { cM=4; cOb=-2; cO=2; cF+=6; }
        if (type==='nap') { cF=-15; cO=1; }
        if (type==='plant') { cM=1; cMood=3; }
        if (type==='sweets') { cMood=6; cO=3; cF+=2; }
        if (type==='spy') { cK=2; cOb=-1; }
        if (type==='visit') { cO=6; cOb=1; }
        if (type==='listen') { cK=2; cM=2; }

        g.b.magic += cM; g.b.know += cK; g.b.obed += cOb; g.b.obsess += cO;
        g.w.fatigue += cF; g.w.mood += cMood;

        log(txt);
        checkStatusAndAdvance();
    }

    function checkStatusAndAdvance() {
        if (g.w.fatigue >= 100) { triggerFaintEvent(); return; }
        if (g.b.obsess >= 70 && !g.flags.obsessWarned) {
            g.flags.obsessWarned = true;
            log(`【深渊的凝视】你转头，恰好撞见 ${g.bName} 站在阴影中看你的眼神。那不是看长辈的目光，而是混杂着极度渴望、饥饿与占有欲的疯狂泥沼。<br>如果他的【偏执】继续升高，他很可能会做出越界的事情。`, 'danger');
            return;
        }

        g.mo++;
        g.w.mood = Math.max(0, Math.min(100, g.w.mood));
        g.w.fatigue = Math.max(0, Math.min(100, g.w.fatigue));
        g.b.obsess = Math.max(0, g.b.obsess); 
        
        if(g.mo > 12) {
            g.mo = 1; g.yr++; g.age++;
            checkYearlyEvents();
        } else {
            updateUI();
        }
    }

    function getEvents() {
        let W = g.wName, B = g.bName;
        return {
            faint: [
                { t: `【魔力衰竭】<br>眼前的色块轰然碎裂。你太久没有休息，身体出于保护机制强制切断了你的意识。你倒了下去。<br>在失去意识的瞬间，你看到 ${B} 疯了一样冲向你，他脸上出现了从未有过的惊恐与慌乱。`, btn: "陷入无尽的黑甜", next: 1 },
                { t: `你睡了整整一个月。<br>当你醒来时，发现自己躺在柔软的床榻上。${B} 跪在床边，紧紧攥着你的手。他形销骨立，眼眶通红，不知守了你多久。<br>当你睁开眼，他猛地将脸埋进你的掌心，滚烫的液体砸在你的肌肤上。他声音嘶哑到了极点：“如果您再也醒不过来……我就把这座塔烧了，然后下去找您。”`, btn: "拍拍他的头，告诉他魔女没那么容易死", action: "endFaint" }
            ],
            age12: [
                { t: `【访客 · 十二岁】<br>你的精灵旧友法洛斯来塔里蹭饭。他看着端茶倒水、包揽了一切家务的 ${B}，挑了挑眉。<br>“${W}，你竟然把一个人类养了这么久？”法洛斯轻笑，“送去人类的学院吧，别让他整天跟着你在这个破塔里发霉。”`, btn: "观察卢西恩的反应", next: 1 },
                { t: `你看向 ${B}。他恭顺地低着头，倒茶的手极稳，连一滴水珠都没有溅出。<br>但凭借你老辣的直觉，你清晰地感知到法洛斯的茶杯里，被悄无声息地下了一滴高阶神经毒素。你用魔力蒸发了毒药，心里暗笑：这小家伙哪里来的这么多心眼？。<br>“确实，”你摸了摸下巴，“是该把你扔去人类社会锻炼一下了。”`, btn: "决定送他去王城学院", action: "end12" }
            ],
            age14: [
                { t: `【学院风波 · 十四岁】<br>这是他进入王城高等人类学院的第二年。你闲来无事，隐去身形去学院探望他。<br>你在一处偏僻的走廊里看到了他。几个贵族高年级生正试图挑衅他，用极其恶毒的语言侮辱他是一个“没有父母的乡巴佬野种”。`, btn: "继续观察", next: 1 },
                { t: `你本以为他会大发雷霆或隐忍不发。但他只是微微一笑，那笑容极其温和，却让人不寒而栗。<br>他甚至没有念动咒语，只是抬了抬手指。那几个贵族学生的舌头瞬间被凭空生出的冰刺贯穿，鲜血喷涌，倒在地上痛苦翻滚。<br>“我的确没有父母。”他走到带头人面前，踩住对方的手指，声音轻柔，“但我有一位，你们连直视资格都没有的存在。”`, btn: "若有所思地离开", next: 2 },
                { t: `你走在回魔女塔的路上，心里嘀咕着。<br>这孩子的手段也太狠厉了些。如果他在学院里的【魔法】和【学识】能足够强大，也许就不用一直用这种极端的方式保护自己了吧？<br>或者，如果他平时能再听话一点，【乖巧】高一点，少一点那种扭曲的【偏执】，未来也许真的能像个正常人一样生活呢。这都要看怎么引导他了。`, btn: "岁月流转", action: "end14" }
            ],
            age16: [
                { t: `【禁忌储藏室】<br>午夜，刺耳的警报撕裂了高塔的死寂。<br>你瞬移至地底最深处的禁忌储藏室。那是你存放千万年回忆的地方——沾染神血的断剑、陨落帝国的皇冠。这些浸透了历史重量的古物，其精神威压足以瞬间碾碎凡人的灵魂。`, btn: "走入储藏室", next: 1 },
                { t: `你在散落的古卷中找到了他。<br>他跪在地上，七窍流血，皮肤因承受不住魔压而寸寸皲裂。但他手里只死死攥着一只破旧的胸针——那是几百年前，某个曾向你求爱的人类骑士留下的遗物。<br>他缓缓抬起头，那双深郁的眼眸布满了绝望的狂乱：“原来……这才是真实的您。经历了那么多生离死别的您……我在您的生命里，究竟算什么？！”`, 
                  choices: [
                      { t: "【叹息】用庞大魔力强行护住他濒死的灵魂，封印今夜的记忆", next: 2 },
                      { t: "【冷漠】释放千万年魔女的恐怖威压，彻底碾碎他的狂妄", next: 3 }
                  ] 
                },
                { t: `你轻叹一声。浩瀚的魔力温柔而强势地包裹住他濒临崩毁的意识，将那些足以逼疯他的历史残响一同封印。<br>他在你怀里昏睡过去。你以为风波已平，却未曾察觉，在封印的最深处，名为【执念】的根须已与他的骨血彻底绞杀在一起。`, btn: "未来的两年，一切都将不同", action: "end16_1" },
                { t: `你冷酷地俯视着他，魔女的威压轰然释放。<br>“连这点岁月的重量都承受不住，也敢妄图介入我的过去？”<br>他被死死压在地板上，骨骼悲鸣。但在那张沾满鲜血的脸上，原本的乖巧彻底碎裂，扯出了一个令人毛骨悚然的狂热笑容。<br>“既然凡人无法企及您……那就让我堕落成与您比肩的怪物吧。”`, btn: "未来的两年，一切都将不同", action: "end16_2" }
            ],
            age17: [
                { t: `【成年前夕 · 十七岁】<br>还有一年，他就要十八岁成年，并且从人类学院毕业了。<br>你靠在藤椅上，手里把玩着一颗水晶球，看着里面倒映出他在厨房里为你忙碌的背影。他的肩膀已经完全长开，比你高出了大半个头。那件围裙穿在他身上显得有些滑稽，但他却乐在其中。`, btn: "继续思索", next: 1 },
                { t: `你开始盘算他十八岁之后的事情。是像以前养的那些小动物一样，长大了就放归山林，让他去魔法工会谋个一官半职，娶妻生子度过一生？<br>还是说……继续把他留在塔里？<br>最近高塔里的空气变得越来越粘稠。他看你的眼神不再有任何掩饰，犹如即将破笼的野兽。如果真的把他留下来，你们之间，该以什么身份继续相处呢？这真是个令人头疼的问题。`, btn: "随他去吧", action: "end17" }
            ],
            ending: [
                { t: `【终局 · 漫长岁月的余烬】<br>第十一个年头，他十八岁了。<br>人类的躯壳在此刻长成，而他灵魂的走向，也将在此刻定格。命运的审判降临在钟声里。`, btn: "开启最终审判", action: "judgeEnding" }
            ]
        };
    }

    function triggerFaintEvent() {
        g.w.fatigue -= 80; g.mo += 1; 
        if(g.mo > 12) { g.mo -= 12; g.yr++; g.age++; }
        g.eventMode = true; g.currentEvent = getEvents()['faint']; g.eventStep = 0;
        document.getElementById('location-bar').classList.add('hidden');
        renderEventStep();
    }

    function checkYearlyEvents() {
        let ev = null;
        if (g.age === 12) ev = 'age12';
        else if (g.age === 14) ev = 'age14';
        else if (g.age === 16) ev = 'age16';
        else if (g.age === 17) ev = 'age17';
        else if (g.age === 18) ev = 'ending';
        else {
            let hints = {
                8: `他八岁了。像一只护食的小兽，将所有试图靠近高塔的低级魔物都凶狠地驱逐了。`,
                9: `他九岁了。他偷偷用工坊的烤箱烤了一个边缘微焦的草莓蛋糕。当你吃下第一口时，他眼里的光亮得惊人。`,
                10: `他十岁了。你带他去了集市，他给你买了一把廉价的发卡，却因为自卑不敢送给你。`,
                11: `你发现他在疯狂查阅“灵魂绑定”的魔法书。你懒得管他，只当是小孩子的叛逆期。`,
                13: `他进入了变声期，身高开始疯长。他做饭的手艺越来越好，简直是完美的家政小能手。`,
                15: `他在学院极受欢迎。你看到有人给他送情书，打趣他时，他的脸黑得像锅底。`
            };
            if(hints[g.age]) log(`【流年转瞬 · ${g.age}岁】<br>${hints[g.age]}`, 'sys');
            updateUI();
            return;
        }
        
        g.eventMode = true; g.currentEvent = getEvents()[ev]; g.eventStep = 0;
        document.getElementById('location-bar').classList.add('hidden');
        renderEventStep();
        updateUI();
    }

    function renderEventStep() {
        let stepData = g.currentEvent[g.eventStep];
        log(stepData.t, 'event');
        
        let bar = document.getElementById('action-bar');
        bar.innerHTML = '';
        
        if (stepData.choices) {
            stepData.choices.forEach(c => {
                let btn = document.createElement('button');
                btn.className = 'btn-event'; btn.innerText = c.t;
                btn.onclick = () => { g.eventStep = c.next; renderEventStep(); };
                bar.appendChild(btn);
            });
        } else if (stepData.btn) {
            let btn = document.createElement('button');
            btn.className = 'btn-event'; btn.innerText = stepData.btn;
            btn.onclick = () => {
                if (stepData.next) { g.eventStep = stepData.next; renderEventStep(); }
                else if (stepData.action) executeEventAction(stepData.action);
            };
            bar.appendChild(btn);
        }
    }

    function executeEventAction(action) {
        g.eventMode = false;
        document.getElementById('location-bar').classList.remove('hidden');
        let bar = document.getElementById('action-bar'); bar.innerHTML = '';

        if (action === 'endFaint') {
            // resume
        }
        if (action === 'end12') {
            document.getElementById('btn-academy').classList.remove('hidden');
            log(`（已解锁新地点：王城学院）`, 'sys');
        }
        if (action === 'end14') {
            document.getElementById('btn-town').classList.remove('hidden');
            log(`（已解锁新地点：王城街道）`, 'sys');
        }
        if (action === 'end16_1') {
            g.b.obsess -= 10; g.b.obed += 10; g.flags.after16 = true;
        }
        if (action === 'end16_2') {
            g.b.obsess += 30; g.b.obed -= 20; g.flags.after16 = true;
        }
        if (action === 'end17') {
            // resume
        }
        if (action === 'judgeEnding') {
            let b = g.b;
            let title = "", desc = "";
            let W = g.wName, B = g.bName;
            
            if (b.obsess >= 70 && b.obed < 30) {
                title = "【终焉：凡尘一梦 (Bad End)】";
                desc = `他的疯狂彻底冲破了理智的牢笼。在十八岁这天的晚餐时，他在你的红茶中下达了无色无味的“灵魂锁链”，妄图废去你的魔力，将你永生永世囚禁。<br>你看着杯中细微的魔力流转，眼中闪过一丝极度的疲惫与无聊。你没有发怒，只是像丢弃一件坏掉的玩具般，一指点在他的眉心。<br>“真是……没意思。”<br>浩瀚的魔力瞬间摧毁了他的魔法回路，并霸道地抹除了他这十一年的所有记忆。你拎着他的衣领，将他扔出了高塔。<br>醒来后，他只是一个在街头流浪的普通青年。他总觉得心里空了一块，每天望着天空发呆，却永远也记不起，高塔之上那位他曾愿献祭灵魂去爱的魔女。这种巨大的失落感将伴随他一生。`;
            } else if (b.obsess >= 50 && b.obed >= 40 && b.magic >= 40) {
                title = "【终焉：禁忌的沉沦 (True End)】";
                desc = `为了追赶你那无尽的寿命，他毫不犹豫地献祭了半个灵魂与深渊交易，获得了近乎永恒的生命与恐怖的魔力。<br>十八岁成年的这一夜，他不再掩饰那病态的占有欲。当你在工坊里查看图鉴时，他从背后抱住了你，将你狠狠压在冰冷的石桌上。<br>“母亲，”他低沉的声音在你耳边响起，“我终于有资格与您共享这漫长的诅咒了。”他撕碎了虚伪的敬畏，灼热的吻带着浓烈的侵略性和绝望的爱意，席卷了你的全身。<br>你本可以轻易推开他，但看着他那双为了你而堕落深渊的疯狂眼眸，你突然觉得，漫长的生命实在太无聊了，养个小疯狗在身边解闷也不错。<br>你扬起脖颈，纵容了他的冒犯。在这座永远对世俗封闭的高塔里，你们跨越了伦理的界限，用最不堪、最狂热的方式，开始了背德而诡异的永恒共生。日复一日，年复一年。`;
            } else if (b.know >= 70 && b.magic >= 70 && b.obsess < 50) {
                title = "【终焉：人类之光 (Happy End)】";
                desc = `他克服了内心阴暗的泥沼，将你教导的知识与力量用于正途。他以满分首席的成绩从人类学院毕业。在毕业典礼上，他在万众瞩目下向坐在观众席角落的你深深鞠躬。<br>随后他步入政坛，凭借深不可测的魔法与手腕，成为了帝国历史上最年轻的宰相与大魔导师。他为人类带来了百年的和平与繁荣。<br>你偶尔会化作乌鸦，停在王城高耸的钟楼上俯视他。而他每次都会精准地捕捉到你的目光，并将你最爱的限量版草莓蛋糕放在窗台。<br>几十年后，他在子孙的环绕下安详老去。在他的国葬上，整个帝国都在悲鸣。你站在远处的山巅，看着长长的送葬队伍，轻笑了一声。干得不错，小鬼。<br>你转身，重新融入了无尽的岁月之中。`;
            } else {
                title = "【终焉：平庸的告别 (Normal End)】";
                desc = `他的天赋未能兑现，那份深沉的执念也未能生根发芽。十八岁这天，他背上了行囊，在魔女塔的门口向你深深一拜。<br>“感谢您这些年的教导。”他微笑着说，眼神清澈而平庸。<br>他离开了高塔，去往边境小镇成为了一名普通的魔法公会干事。他遇到了一个温柔的女孩，娶妻生子，每天为了柴米油盐而劳碌，过完了平凡的一生。<br>你在塔顶看着他远去的背影，打了个哈欠，躺回了藤椅上。这不过是你漫长生命中，一段微不足道的小插曲。很快，你就会连他的名字都忘记。`;
            }
            
            g.eventMode = true; 
            document.getElementById('location-bar').classList.add('hidden');
            log(`<br><span style="color:var(--danger-red); font-size:20px; font-weight:bold;">${title}</span><br><br><span style="color:#dcdcdc;">${desc}</span>`, 'event');
            
            let btn = document.createElement('button');
            btn.className = 'btn-event'; btn.innerText = "逆转时空（重新开始）"; btn.style.marginTop = "20px";
            btn.onclick = () => location.reload();
            bar.appendChild(btn);
            return;
        }

        renderActions();
        updateUI();
    }

    function updateUI() {
        document.getElementById('ui-year').innerText = g.yr; 
        document.getElementById('ui-month').innerText = g.mo; 
        document.getElementById('ui-age').innerText = g.age;
        
        document.getElementById('b-magic').innerText = g.b.magic; 
        document.getElementById('b-know').innerText = g.b.know; 
        document.getElementById('b-obed').innerText = g.b.obed; 
        document.getElementById('b-obsess').innerText = g.b.obsess;
        
        document.getElementById('w-mood').style.width = g.w.mood + '%'; 
        document.getElementById('w-fatigue').style.width = g.w.fatigue + '%';
    }

    function log(txt, type='normal') {
        let box = document.getElementById('story-box');
        let div = document.createElement('div');
        div.className = 'entry fade-in ' + type;
        div.innerHTML = txt;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
